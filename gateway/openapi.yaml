openapi: 3.0.3
info:
  title: kkode Gateway API
  version: 0.1.0
  description: |
    kkode의 session-aware coding agent gateway API예요.
    REST는 session/run 제어면을 담당하고, SSE는 event replay/stream을 담당해요.
servers:
  - url: http://127.0.0.1:41234
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: 프로세스 health를 확인해요.
      security: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 정상이에요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      operationId: getReadyz
      summary: gateway 준비 상태를 확인해요.
      security: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 준비됐어요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /api/v1:
    get:
      operationId: getAPIIndex
      summary: API discovery index를 반환해요.
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 주요 API link 목록이에요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIIndexResponse'
  /api/v1/openapi.yaml:
    get:
      operationId: getOpenapiYaml
      summary: 현재 OpenAPI YAML 스펙을 반환해요.
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OpenAPI YAML 문서예요.
          content:
            application/yaml:
              schema:
                type: string
  /api/v1/providers:
    get:
      operationId: getProviders
      summary: gateway가 알고 있는 provider 목록을 반환해요.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: provider 목록이에요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderListResponse'
  /api/v1/providers/{provider}:
    get:
      operationId: getProvidersByProvider
      summary: provider 이름이나 alias로 provider 상세를 반환해요.
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: provider 상세예요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/providers/{provider}/test:
    post:
      operationId: postProvidersByProviderTest
      summary: provider 단독 preflight와 선택적 live smoke를 실행해요.
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderTestRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: provider test 결과예요. live 실패도 ok=false 본문으로 반환할 수 있어요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderTestResponse'
  /api/v1/models:
    get:
      operationId: getModels
      summary: provider별 model catalog를 반환해요.
      parameters:
        - in: query
          name: provider
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: model 목록이에요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelListResponse'
  /api/v1/sessions:
    get:
      operationId: getSessions
      summary: session 목록을 반환해요.
      parameters:
        - in: query
          name: project_root
          schema:
            type: string
        - in: query
          name: provider
          schema:
            type: string
            maxLength: 128
          description: session provider_name 값으로 좁혀요.
        - in: query
          name: model
          schema:
            type: string
            maxLength: 128
          description: session model 값으로 좁혀요.
        - in: query
          name: mode
          schema:
            type: string
            enum: [build, plan, ask]
          description: session mode 값으로 좁혀요.
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            maximum: 200
        - $ref: '#/components/parameters/Offset'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: session 목록이에요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
    post:
      operationId: postSessions
      summary: 새 session을 만들어요.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          description: 생성된 session이에요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
  /api/v1/sessions/{session_id}:
    get:
      operationId: getSessionsBySessionId
      summary: session 상세를 반환해요.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: session 상세예요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/runs:
    get:
      operationId: getRuns
      summary: background run 목록을 반환해요.
      parameters:
        - in: query
          name: session_id
          schema:
            type: string
        - in: query
          name: turn_id
          schema:
            type: string
          description: run이 연결된 turn_id 값으로 좁혀요.
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: provider
          schema:
            type: string
            maxLength: 128
          description: run provider 값으로 좁혀요.
        - in: query
          name: model
          schema:
            type: string
            maxLength: 128
          description: run model 값으로 좁혀요.
        - in: query
          name: request_id
          schema:
            type: string
            maxLength: 128
          description: "`X-Request-Id`에서 run metadata로 전파된 request id로 좁혀요."
        - in: query
          name: idempotency_key
          schema:
            type: string
            maxLength: 128
          description: "`Idempotency-Key` 또는 metadata.idempotency_key로 저장된 key로 좁혀요."
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            maximum: 200
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
            minimum: 0
          description: 다음 page를 가져올 0-based run offset이에요. 응답의 next_offset을 그대로 넣으면 돼요.
      responses:
        '200':
          description: run 목록이에요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunListResponse'
        '501':
          $ref: '#/components/responses/Error'
    post:
      operationId: postRuns
      summary: agent background run을 시작해요.
      description: gateway는 run을 즉시 접수하고 실제 agent 실행은 background RunManager에서 이어가요. `Idempotency-Key` header나 `metadata.idempotency_key`가 같으면 기존 run을 반환해요.
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
            maxLength: 128
          description: 같은 run 생성 요청의 재시도를 묶는 key예요.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunStartRequest'
      responses:
        '200':
          description: 같은 idempotency key의 기존 run을 반환했어요.
          headers:
            X-Idempotent-Replay:
              schema:
                type: string
              description: 기존 run 재사용이면 `true`예요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '202':
          description: run이 접수됐어요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '501':
          $ref: '#/components/responses/Error'
  /api/v1/runs/{run_id}:
    get:
      operationId: getRunsByRunId
      summary: background run 상태를 조회해요.
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: run 상세예요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '404':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/Error'

  /api/v1/runs/{run_id}/events:
    get:
      operationId: getRunsByRunIdEvents
      summary: run 상태 변경을 JSON 또는 SSE로 받아요.
      parameters:
        - $ref: '#/components/parameters/RunID'
        - in: query
          name: after_seq
          schema:
            type: integer
            default: 0
          description: 이 seq 이후 durable run event만 replay해요.
        - in: query
          name: limit
          schema:
            type: integer
            default: 200
            maximum: 1000
        - in: query
          name: type
          schema:
            type: string
          description: durable run event type 값으로 좁혀요.
        - in: query
          name: stream
          schema:
            type: boolean
          description: true면 run 상태 변경을 text/event-stream으로 받아요. 잘못된 boolean 값은 400으로 거부해요.
        - in: query
          name: heartbeat_ms
          schema:
            type: integer
            default: 15000
            minimum: 0
            maximum: 300000
          description: SSE idle heartbeat 주기예요. 잘못된 값은 400으로 거부하고 0은 기본 15초, 너무 낮은 값은 10ms로 보정해요.
      responses:
        '200':
          description: run event snapshot 또는 live stream이에요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEventListResponse'
            text/event-stream:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/runs/{run_id}/transcript:
    get:
      operationId: getRunsByRunIdTranscript
      summary: run 하나에 해당하는 turn, session event, run event transcript를 조회해요.
      parameters:
        - $ref: '#/components/parameters/RunID'
        - in: query
          name: redact
          schema:
            type: boolean
            default: true
          description: false면 secret redaction 없이 원문에 가깝게 반환해요. 잘못된 boolean 값은 400으로 거부해요.
        - in: query
          name: event_limit
          schema:
            type: integer
            default: 500
            maximum: 5000
          description: run turn에 연결된 session event를 읽을 최대 개수예요.
        - in: query
          name: limit
          schema:
            type: integer
            default: 200
            maximum: 1000
          description: durable run event를 읽을 최대 개수예요.
        - in: query
          name: max_markdown_bytes
          schema:
            type: integer
            default: 1048576
            maximum: 8388608
          description: markdown preview를 이 byte 수까지 UTF-8 안전하게 잘라요. 0이면 제한하지 않아요.
      responses:
        '200':
          description: run 단위 transcript예요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunTranscriptResponse'
        '404':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/Error'

  /api/v1/runs/{run_id}/retry:
    post:
      operationId: postRunsByRunIdRetry
      summary: 기존 run의 prompt와 session으로 새 background run을 시작해요.
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '202':
          description: retry run이 접수됐어요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '404':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/Error'
  /api/v1/runs/{run_id}/cancel:
    post:
      operationId: postRunsByRunIdCancel
      summary: background run을 취소해요.
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: 취소 요청이 반영된 run이에요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '404':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    SessionID:
      in: path
      name: session_id
      required: true
      schema:
        type: string
        maxLength: 128
        pattern: '^[A-Za-z0-9_.-]+$'
    RunID:
      in: path
      name: run_id
      required: true
      schema:
        type: string
        maxLength: 128
        pattern: '^[A-Za-z0-9_.-]+$'
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        default: 100
        maximum: 500
    Offset:
      in: query
      name: offset
      schema:
        type: integer
        default: 0
        minimum: 0
  responses:
    Error:
      description: 표준 error envelope이에요.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    HealthResponse:
      type: object
      required: [ok, time]
      properties:
        ok:
          type: boolean
        time:
          type: string
          format: date-time
    ReadyResponse:
      type: object
      required: [ready, time]
      properties:
        ready:
          type: boolean
        time:
          type: string
          format: date-time
    APIIndexResponse:
      type: object
      description: adapter bootstrap용 discovery index예요. links는 하위 호환 URL map이고 operations는 method-aware route catalog예요.
      required: [version, links, operations]
      properties:
        version:
          type: string
        commit:
          type: string
        links:
          type: object
          description: 기존 adapter가 쓰는 endpoint 이름별 URL map이에요.
          additionalProperties:
            type: string
        operations:
          type: array
          description: OpenAPI 다운로드 전에도 write/action route method를 추론 없이 알 수 있게 하는 endpoint catalog예요.
          items:
            $ref: '#/components/schemas/APIIndexOperation'
    APIIndexOperation:
      type: object
      description: API index에 노출되는 이름, HTTP method, path 조합이에요.
      required: [name, method, path]
      properties:
        name:
          type: string
          description: API index links map의 key와 같은 안정적인 operation 이름이에요.
        method:
          type: string
          description: 이 endpoint를 호출할 때 사용할 HTTP method예요.
          enum: [GET, POST, PUT, DELETE]
        path:
          type: string
          description: API root 기준 endpoint path예요.
    ProviderCapabilityKey:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
    ProviderPipelineStage:
      type: object
      required: [name]
      properties:
        name:
          type: string
        input:
          type: string
        output:
          type: string
        description:
          type: string
    Limit:
      type: object
      required: [max_request_bytes]
      properties:
        max_request_bytes:
          type: integer
          format: int64
        max_concurrent_runs:
          type: integer
        run_timeout_seconds:
          type: integer
        run_max_iterations:
          type: integer
        run_web_max_bytes:
          type: integer
          format: int64
        max_session_id_bytes:
          type: integer
        max_turn_id_bytes:
          type: integer
        max_run_id_bytes:
          type: integer
        max_project_root_bytes:
          type: integer
        max_mcp_http_response_bytes:
          type: integer
        max_mcp_probe_name_bytes:
          type: integer
        max_mcp_probe_uri_bytes:
          type: integer
        max_mcp_probe_argument_bytes:
          type: integer
        max_mcp_probe_output_bytes:
          type: integer
        max_file_content_bytes:
          type: integer
        max_file_path_bytes:
          type: integer
        max_file_pattern_bytes:
          type: integer
        max_file_checkpoint_id_bytes:
          type: integer
        max_checkpoint_id_bytes:
          type: integer
        max_resource_id_bytes:
          type: integer
        max_artifact_id_bytes:
          type: integer
        max_todo_id_bytes:
          type: integer
        max_skill_preview_bytes:
          type: integer
        max_subagent_preview_prompt_bytes:
          type: integer
        max_prompt_template_name_bytes:
          type: integer
        max_prompt_text_bytes:
          type: integer
        max_transcript_markdown_bytes:
          type: integer
        max_git_diff_bytes:
          type: integer
        max_git_path_bytes:
          type: integer
        max_run_preview_bytes:
          type: integer
        max_run_output_tokens:
          type: integer
        max_provider_test_preview_bytes:
          type: integer
        max_provider_test_result_bytes:
          type: integer
        max_provider_test_output_tokens:
          type: integer
        max_provider_test_timeout_ms:
          type: integer
        max_http_json_response_bytes:
          type: integer
          format: int64
        max_workspace_file_read_bytes:
          type: integer
        max_workspace_file_write_bytes:
          type: integer
        max_workspace_list_entries:
          type: integer
        max_workspace_glob_matches:
          type: integer
        max_workspace_grep_matches:
          type: integer
        max_workspace_patch_bytes:
          type: integer
        max_lsp_format_input_bytes:
          type: integer
        max_lsp_format_preview_bytes:
          type: integer
        max_run_prompt_bytes:
          type: integer
        max_run_selector_items:
          type: integer
        max_run_selector_item_bytes:
          type: integer
        max_run_context_blocks:
          type: integer
        max_run_context_block_bytes:
          type: integer
        max_run_metadata_entries:
          type: integer
        max_run_metadata_key_bytes:
          type: integer
        max_run_metadata_value_bytes:
          type: integer
        max_request_id_bytes:
          type: integer
        max_idempotency_key_bytes:
          type: integer
        max_tool_call_name_bytes:
          type: integer
        max_tool_call_id_bytes:
          type: integer
        max_tool_call_argument_bytes:
          type: integer
        max_tool_call_output_bytes:
          type: integer
        max_tool_call_web_bytes:
          type: integer
          format: int64
        max_shell_timeout_ms:
          type: integer
          format: int64
        max_shell_output_bytes:
          type: integer
        max_shell_stderr_bytes:
          type: integer
        max_run_provider_model_bytes:
          type: integer
    DiagnosticCheck:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
        message:
          type: string
    RunRuntimeStats:
      type: object
      properties:
        tracked_runs:
          type: integer
        active_runs:
          type: integer
        queued_runs:
          type: integer
        running_runs:
          type: integer
        cancelling_runs:
          type: integer
        terminal_runs:
          type: integer
        max_concurrent_runs:
          type: integer
        occupied_run_slots:
          type: integer
        available_run_slots:
          type: integer
        run_timeout_seconds:
          type: integer
    Feature:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
        description:
          type: string
        endpoints:
          type: array
          items:
            type: string
    ProviderListResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/Provider'
        total_providers:
          type: integer
          description: limit/offset 적용 전 provider 수예요.
        limit:
          type: integer
        offset:
          type: integer
        next_offset:
          type: integer
        result_truncated:
          type: boolean
          description: limit 때문에 provider 목록이 잘렸는지 알려줘요.
    ProviderTestRequest:
      type: object
      properties:
        model:
          type: string
        prompt:
          type: string
        stream:
          type: boolean
        live:
          type: boolean
        metadata:
          type: object
          maxProperties: 64
          propertyNames:
            type: string
            maxLength: 128
            pattern: '^[A-Za-z0-9_.-]+$'
          additionalProperties:
            type: string
            maxLength: 1024
          description: provider conversion/live smoke metadata예요. key/value는 trim되고 빈 항목은 제거되며, key는 영문/숫자/._-만 허용해요.
        max_preview_bytes:
          type: integer
          minimum: 0
        max_output_tokens:
          type: integer
          minimum: 0
        max_result_bytes:
          type: integer
          minimum: 0
          description: live provider smoke 응답 text를 이 byte 수까지 잘라서 반환해요. 0이면 제한하지 않아요.
        timeout_ms:
          type: integer
          minimum: 0
          description: live provider smoke 호출에 적용할 timeout이에요. 0이면 기본 60초를 사용해요.
    ProviderTestResponse:
      type: object
      required: [ok, provider]
      properties:
        ok:
          type: boolean
        provider:
          type: string
        model:
          type: string
        auth_status:
          type: string
        live:
          type: boolean
        stream:
          type: boolean
        code:
          type: string
          description: ok=false일 때 외부 adapter가 분기할 수 있는 안정적인 실패 코드예요.
        message:
          type: string
        provider_request:
          $ref: '#/components/schemas/ProviderRequestPreview'
        result:
          $ref: '#/components/schemas/ProviderTestResult'
    ProviderTestResult:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        text:
          type: string
        text_bytes:
          type: integer
