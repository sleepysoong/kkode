        result_truncated:
          type: boolean
        next_after_seq:
          type: integer
    RunEvent:
      type: object
      required: [seq, type, run]
      properties:
        seq:
          type: integer
        at:
          type: string
          format: date-time
        type:
          type: string
        tool:
          type: string
          description: tool trace event이면 tool 이름이에요.
        message:
          type: string
          description: agent/tool progress message예요. gateway observer는 secret 값을 마스킹해요.
        error:
          type: string
          description: agent/tool progress error예요.
        payload:
          description: 확장 progress payload예요.
        run:
          $ref: '#/components/schemas/Run'
    Run:
      type: object
      required: [id, session_id, status]
      properties:
        id:
          type: string
          maxLength: 128
          pattern: '^[A-Za-z0-9_.-]+$'
        session_id:
          type: string
        turn_id:
          type: string
        status:
          type: string
          enum: [queued, running, cancelling, completed, failed, cancelled]
        prompt:
          type: string
        provider:
          type: string
        model:
          type: string
        working_directory:
          type: string
        max_output_tokens:
          type: integer
          description: 실행 당시 provider 출력 token 상한이에요.
        mcp_servers:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            type: string
        subagents:
          type: array
          items:
            type: string
        enabled_tools:
          type: array
          description: 실행 당시 local tool surface allowlist예요.
          items:
            type: string
        disabled_tools:
          type: array
          description: 실행 당시 local tool surface denylist예요.
          items:
            type: string
        context_blocks:
          type: array
          description: 실행 당시 요청에 포함된 임시 prompt context예요.
          items:
            type: string
        events_url:
          type: string
          description: Run event replay/SSE URL이에요. `/api/v1/runs/{run_id}/events` 형식으로 제공해요.
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
          format: int64
          description: ended_at와 started_at 차이를 millisecond로 계산한 실행 시간이에요. 아직 끝나지 않았거나 timestamp가 부족하면 생략돼요.
        error:
          type: string
        usage:
          $ref: '#/components/schemas/Usage'
        metadata:
          type: object
          maxProperties: 64
          propertyNames:
            type: string
            maxLength: 128
            pattern: '^[A-Za-z0-9_.-]+$'
          additionalProperties:
            type: string
            maxLength: 1024
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
          maxLength: 128
        details:
          type: object
          additionalProperties: true
